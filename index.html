<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Polistagram</title>
  <link rel="icon" type="image/png" href="assets/icons/brand.png" />

  <!-- Pretendard: 한글 UI에 널리 쓰이는 깔끔한 산세리프. Google Fonts에 없어서 공식 CDN(jsdelivr)으로 받는다. -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

  <!-- match.html과 같은 스타일시트를 공유한다 (2026-09-26, Pico.css 제거 — 두 화면 색/컴포넌트를
       한 곳(styles.css :root)에서만 관리한다). -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <script>
    // 이미 프로필을 제출한 적 있는 사용자는 히어로/폼을 다시 볼 필요 없이 바로
    // My Feed로 보낸다. 단, localhost(로컬 개발 중)는 제외 — 안 그러면 테스트 중에
    // 저장한 프로필 때문에 index.html을 열 때마다 계속 match.html로 튕겨서
    // 폼 화면 자체를 확인/수정하기 어려워진다. 화면이 보이기 전에 최대한 빨리
    // 판단하려고 <body> 맨 앞, 다른 스크립트보다 먼저 둔다.
    const IS_LOCAL = location.hostname === "localhost" || location.hostname === "127.0.0.1";
    if (!IS_LOCAL && localStorage.getItem("polistagram_profile")) {
      location.replace("match.html");
    }
  </script>

  <header class="hero">
    <div class="hero-brand">
      <img class="hero-icon" src="assets/icons/brand.png" alt="" />
      <h1 class="hero-title">Polistagram</h1>
    </div>
    <p class="hero-tagline">쏟아지는 금융정책, 나에게 필요한 것만 쉽게.</p>
    <button id="start-btn" type="button" class="btn btn-primary">시작하기</button>
  </header>

  <!-- 처음엔 접혀 있다가(max-height: 0) #start-btn을 누르면 JS가 .open 클래스를 붙여서 펼친다. -->
  <section id="profile-section" class="profile-section">
    <div class="profile-card">
      <form id="profile-form">
        <label class="field">
          <span class="field-label">거주지역</span>
          <select id="region" name="region" class="select" required>
            <option value="" disabled selected>선택해주세요</option>
            <option>서울</option>
            <option>부산</option>
            <option>대구</option>
            <option>인천</option>
            <option>광주</option>
            <option>대전</option>
            <option>울산</option>
            <option>세종</option>
            <option>경기</option>
            <option>강원</option>
            <option>충북</option>
            <option>충남</option>
            <option>전북</option>
            <option>전남</option>
            <option>경북</option>
            <option>경남</option>
            <option>제주</option>
          </select>
        </label>

        <label class="field">
          <span class="field-label">성별</span>
          <select id="gender" name="gender" class="select" required>
            <option value="" disabled selected>선택해주세요</option>
            <option>남성</option>
            <option>여성</option>
          </select>
        </label>

        <label class="field">
          <span class="field-label">생년월일</span>
          <input type="date" id="birth_date" name="birth_date" class="input" required />
        </label>

        <label class="field">
          <span class="field-label">개인특성 <small>(선택)</small></span>
          <select id="occupation_type" name="occupation_type" class="select">
            <option value="">해당 없음</option>
            <option>근로자</option>
            <option>구직자</option>
            <option>소상공인·자영업자</option>
            <option>대학생</option>
            <option>프리랜서·특수고용직</option>
          </select>
        </label>

        <fieldset>
          <legend>관심분야 * <small>1개 이상 선택해주세요</small></legend>
          <div class="interest-grid">
            <label class="interest-option"><input type="checkbox" name="interests" value="대출" /> 대출</label>
            <label class="interest-option"><input type="checkbox" name="interests" value="주거·전세" /> 주거·전세</label>
            <label class="interest-option"><input type="checkbox" name="interests" value="저축·자산형성" /> 저축·자산형성</label>
            <label class="interest-option"><input type="checkbox" name="interests" value="투자·주식" /> 투자·주식</label>
            <label class="interest-option"><input type="checkbox" name="interests" value="보험" /> 보험</label>
            <label class="interest-option"><input type="checkbox" name="interests" value="창업·사업자금" /> 창업·사업자금</label>
            <label class="interest-option"><input type="checkbox" name="interests" value="취업·채용" /> 취업·채용</label>
          </div>
        </fieldset>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 2rem;">제출</button>
        <p id="submit-message" class="submit-message" role="status" hidden></p>
        <button type="button" id="reset-btn" class="btn btn-secondary btn-block" style="margin-top: 0.75rem;">프로필 초기화</button>
      </form>

      <!-- 제출 성공 시 위 <form>은 JS가 hidden 처리하고, 이 영역을 대신 보여준다. -->
      <div id="loading-state" class="loading-state" hidden>
        <div class="spinner"></div>
        <p>회원님에게 맞는 정책을 찾고 있어요...</p>
      </div>
    </div>
  </section>

  <script>
    const STORAGE_KEY = "polistagram_profile";
    const form = document.getElementById("profile-form");
    const message = document.getElementById("submit-message");
    const startBtn = document.getElementById("start-btn");
    const profileSection = document.getElementById("profile-section");
    const resetBtn = document.getElementById("reset-btn");

    // "시작하기" 버튼을 누르면 접혀 있던 프로필 폼을 펼친다.
    startBtn.addEventListener("click", () => {
      profileSection.classList.add("open");
      // CSS transition이 끝나기까지 기다렸다가(약 500ms) 화면을 폼 쪽으로 스크롤해준다.
      // block: "start"는 폼의 윗부분이 화면 위쪽에 오도록 스크롤하라는 뜻이다.
      setTimeout(() => {
        profileSection.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 100);
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const checkedInterests = form.querySelectorAll('input[name="interests"]:checked');

      if (checkedInterests.length === 0) {
        message.hidden = false;
        message.style.color = "crimson";
        message.textContent = "관심분야를 1개 이상 선택해주세요.";
        return;
      }

      const profile = {
        region: form.region.value,
        gender: form.gender.value,
        birth_date: form.birth_date.value,
        occupation_type: form.occupation_type.value || null,
        interests: Array.from(checkedInterests).map((el) => el.value),
      };

      localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));

      // 폼을 숨기고 로딩 화면(스피너 + 문구)을 보여준 다음, 잠깐 뒤에 match.html로
      // 자동 이동한다. setTimeout의 두 번째 숫자(밀리초)만큼 기다린 뒤 콜백을 실행한다 —
      // 실제로는 오래 걸리는 작업이 없지만, 너무 빨리 넘어가면 "찾고 있다"는
      // 느낌이 안 들어서 일부러 짧게 대기시킨다.
      form.hidden = true;
      document.getElementById("loading-state").hidden = false;
      setTimeout(() => {
        location.href = "match.html";
      }, 1200);
    });

    // localStorage는 브라우저(기기)마다 따로 저장된다 — 다른 사람의 브라우저에는
    // 영향이 없다. 그래도 테스트하다 저장해둔 프로필을 지우고 싶을 때를 위한 버튼.
    resetBtn.addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      form.reset();
      message.hidden = false;
      message.style.color = "green";
      message.textContent = "✓ 저장된 프로필을 지웠어요.";
    });

    // 이전에 저장해둔 프로필이 있으면 폼에 다시 채워둔다. 단, 첫 화면은 항상
    // 히어로만 보여야 하므로 폼을 펼치지는 않는다 — "시작하기"를 눌러야 펼쳐진다.
    (function restoreProfile() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return;

      const profile = JSON.parse(saved);
      if (profile.region) form.region.value = profile.region;
      if (profile.gender) form.gender.value = profile.gender;
      if (profile.birth_date) form.birth_date.value = profile.birth_date;
      if (profile.occupation_type) form.occupation_type.value = profile.occupation_type;
      (profile.interests || []).forEach((value) => {
        const el = form.querySelector(`input[name="interests"][value="${value}"]`);
        if (el) el.checked = true;
      });
    })();
  </script>
</body>
</html>
