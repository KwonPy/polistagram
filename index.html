<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Polistagram</title>
  <link rel="icon" type="image/png" href="assets/icons/brand.png" />

  <!-- Pico.css: 클래스 없이도 기본 태그(form, input, button...)를 깔끔하게 스타일링해주는 CDN CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />

  <!-- Pretendard: 한글 UI에 널리 쓰이는 깔끔한 산세리프 (2026-09-26, Noto Sans KR에서 교체 —
       더 세련된 에디토리얼 톤을 위해). Google Fonts에 없어서 공식 CDN(jsdelivr)으로 받는다.
       Yellowtail: "Polistagram" 로고 글자에만 쓰는 필기체 폰트 (Instagram 옛 로고 느낌). -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yellowtail&display=swap" />

  <style>
    /* Pico.css는 --pico-* 변수로 색을 관리한다. 값을 새로 정의하면 전체 버튼/링크/포커스 색이 한 번에 바뀐다. */
    :root {
      --pico-font-family: "Pretendard", "Noto Sans KR", sans-serif;
      /* match.html(styles.css)과 같은 색 토큰 — ui-ux-pro-max 스킬의 "Banking/
         Traditional Finance" 팔레트를 참고해 정한 신뢰감 있는 네이비다
         (2026-09-26, 기존 #3a6ea5 옐로/블루 임의 조합에서 두 화면 통일로 변경).
         공유 스타일시트가 없어서 styles.css의 --brand/--brand-dark/--ink와
         같은 값을 여기 각각 적어둔다 — 값을 바꿀 땐 둘 다 같이 바꿔야 한다.
         Pico v2는 버튼 배경(--pico-primary-background 등)이 --pico-primary와
         따로 노는 고정값이라, 관련 변수를 전부 같이 덮어써야 실제로 반영된다. */
      --pico-primary: #1e3a8a;
      --pico-primary-background: #1e3a8a;
      --pico-primary-border: #1e3a8a;
      --pico-primary-hover: #172554;
      --pico-primary-hover-background: #172554;
      --pico-primary-hover-border: #172554;
      --pico-primary-focus: rgba(30, 58, 138, 0.25);
      --pico-primary-inverse: #ffffff;
      --pico-primary-underline: rgba(30, 58, 138, 0.5);
      --pico-primary-hover-underline: #172554;
      /* 배경/글자색도 match.html(--bg-app/--ink/--muted)과 정확히 같은 값으로 맞춘다.
         전에는 여기만 순백(#ffffff)이라 두 화면을 오갈 때 배경이 미묘하게 달라 보였다. */
      --pico-background-color: #f8fafc;
      --pico-card-background-color: #ffffff;
      --pico-color: #0f172a;
      --pico-muted-color: #64748b;
      --pico-h1-color: #0f172a;
      --pico-h2-color: #0f172a;
    }
    /* 관심분야 체크박스는 메인 컬러와 통일한다. */
    input[type="checkbox"]:checked {
      background-color: var(--pico-primary);
      border-color: var(--pico-primary);
    }

    /* 관심분야 체크박스를 2열 그리드로. 화면이 좁아지면(모바일) 1열로 바뀐다. */
    .interest-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.25rem 1rem;
    }
    @media (max-width: 480px) {
      .interest-grid {
        grid-template-columns: 1fr;
      }
    }
    /* 화면 폭이 넓어도 폼이 너무 옆으로 퍼지지 않도록 최대 폭을 제한한다 (가독성). */
    main.container {
      max-width: 560px;
    }

    /* 히어로: match.html과 같은 밝은 배경(#f8fafc) 위에 얹는다. <main class="container">
       바깥(body 바로 아래)에 둬서 좌우 여백 없이 꽉 차게 만든다.
       2026-09-26: 어두운 네이비 그라데이션 전체 배경을 걷어냈다 — 첫 화면이 어두운
       블록이라 첫인상부터 match.html(흰 배경)과 완전히 달라 보였다. 이제 배경은
       페이지 전체와 같은 톤이고, 브랜드 네이비는 로고 글자색으로만 남는다. */
    .hero {
      background: var(--pico-background-color);
      color: var(--pico-color);
      text-align: center;
      padding: 4rem 1rem 5rem;
    }
    /* 아이콘(위, 크게) -> "polistagram"(아래) 세로 배치. 참고 이미지(2026-09-26)에
       맞춰 가로 배치에서 다시 세로 배치로 변경. */
    .hero-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .hero-icon {
      width: 128px;
      height: 128px;
      border-radius: 24px;
      flex: none;
    }
    .hero h1 {
      /* match.html의 .brand-name과 같은 폰트로 통일 — :root의 기본 산세리프
         (Pretendard)를 그대로 물려받는다 (2026-09-26, 필기체 Yellowtail에서 변경).
         아이콘을 크게 키운 만큼 타이틀은 더 줄여서 균형을 맞춘다. */
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 800;
      margin-bottom: 0.75rem;
      line-height: 1.2;
      color: var(--pico-primary);
    }
    .hero p {
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      color: var(--pico-muted-color);
      margin-bottom: 2rem;
    }
    /* "시작하기" 버튼은 이제 밝은 배경 위라, 다른 곳과 같은 네이비 버튼(Pico 기본 --primary)을
       그대로 쓴다 — 흰 배경 반전 버튼은 어두운 히어로에서만 필요했다. */
    #start-btn {
      display: inline-block;
      width: auto;
      font-weight: 700;
      padding: 0.9rem 2.5rem;
    }

    /* 프로필 폼 영역을 히어로와 겹치도록 위로 끌어올려서, 카드가 그라데이션 위에 살짝 걸쳐 보이게 한다. */
    #profile-section {
      margin-top: -3rem;
    }
    /* 처음에는 접혀 있다가(높이 0) "시작하기"를 누르면 .open이 붙으면서 펼쳐진다.
       display:none 대신 max-height를 쓰는 이유: display는 0/1로만 바뀌어 애니메이션이 안 되지만,
       max-height는 숫자값이라 transition으로 부드럽게 바뀌는 모습을 만들 수 있다. */
    #profile-section {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.5s ease, opacity 0.4s ease;
    }
    #profile-section.open {
      max-height: 2000px;
      opacity: 1;
    }
    /* 폼을 감싸는 카드. 페이지 배경(#f8fafc)과 카드 배경(#ffffff)의 색차가 거의 없어서
       테두리+그림자만으로는 잘 안 보였다. match.html의 카드뉴스 스테이지(#cardsStage)와
       같은 방식 — 옅은 블루→화이트 그라데이션 + 진한 그림자 — 로 확실히 분리한다
       (2026-09-26). */
    #profile-card {
      margin-bottom: 0;
      background: linear-gradient(180deg, #eef4fb 0%, #ffffff 60%);
      border: 1px solid #e2e8f0;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.12);
    }
    /* 입력 항목 사이 간격을 넓혀서 각 질문이 하나씩 구분되어 보이게 한다. */
    #profile-form > label {
      display: block;
      font-weight: 500;
      margin-top: 1.5rem;
    }
    #profile-form > label:first-child {
      margin-top: 0;
    }
    fieldset {
      border: none;
      padding: 0;
      margin: 1.5rem 0 0 0;
    }
    fieldset legend {
      font-weight: 500;
      margin-bottom: 0.5rem;
    }
    button[type="submit"] {
      margin-top: 2rem;
    }

    /* 제출 후 보여줄 로딩 화면. 기본은 숨김(hidden 속성)이고, JS가 폼과 자리를
       바꿔서 보여준다. */
    #loading-state {
      text-align: center;
      padding: 2rem 0;
    }
    /* 원형 스피너: 테두리 대부분은 옅게, 한쪽만 브랜드 색으로 칠해서 회전시키면
       "돌아가는 원"처럼 보인다. */
    .spinner {
      width: 2.5rem;
      height: 2.5rem;
      margin: 0 auto 1.25rem;
      border: 3px solid #e2e8f0;
      border-top-color: var(--pico-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #loading-state p {
      color: var(--pico-color);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <script>
    // 이미 프로필을 제출한 적 있는 사용자는 히어로/폼을 다시 볼 필요 없이 바로
    // My Feed로 보낸다. 단, localhost(로컬 개발 중)는 제외 — 안 그러면 테스트 중에
    // 저장한 프로필 때문에 index.html을 열 때마다 계속 match.html로 튕겨서
    // 폼 화면 자체를 확인/수정하기 어려워진다. 화면이 보이기 전에 최대한 빨리
    // 판단하려고 <body> 맨 앞, 다른 스크립트보다 먼저 둔다.
    const IS_LOCAL = location.hostname === "localhost" || location.hostname === "127.0.0.1";
    if (!IS_LOCAL && localStorage.getItem("polistagram_profile")) {
      location.replace("match.html");
    }
  </script>

  <!-- 히어로는 화면 폭 전체를 채워야 해서 .container 바깥(body 바로 아래)에 둔다. -->
  <header class="hero">
    <div class="hero-brand">
      <img class="hero-icon" src="assets/icons/brand.png" alt="" />
      <h1>Polistagram</h1>
    </div>
    <p>쏟아지는 금융정책, 나에게 필요한 것만 쉽게.</p>
    <button id="start-btn" type="button">시작하기</button>
  </header>

  <!-- Pico.css는 <main class="container">로 감싼 내용을 화면 크기에 맞춰
       가운데 정렬 + 여백을 자동으로 잡아준다. 별도 반응형 CSS를 안 짜도 된다. -->
  <main class="container">
    <!-- 처음엔 접혀 있다가(위 CSS의 max-height: 0) #start-btn을 누르면 JS가 .open 클래스를 붙여서 펼친다. -->
    <section id="profile-section">
    <!-- <article>은 Pico.css가 기본으로 카드 모양(테두리+배경+여백)을 입혀주는 태그다.
         새 CSS 없이도 폼 전체가 하나의 카드처럼 보인다. -->
    <article id="profile-card">
    <form id="profile-form">
      <label for="region">거주지역</label>
      <select id="region" name="region" required>
        <option value="" disabled selected>선택해주세요</option>
        <option>서울</option>
        <option>부산</option>
        <option>대구</option>
        <option>인천</option>
        <option>광주</option>
        <option>대전</option>
        <option>울산</option>
        <option>세종</option>
        <option>경기</option>
        <option>강원</option>
        <option>충북</option>
        <option>충남</option>
        <option>전북</option>
        <option>전남</option>
        <option>경북</option>
        <option>경남</option>
        <option>제주</option>
      </select>

      <label for="gender">성별</label>
      <select id="gender" name="gender" required>
        <option value="" disabled selected>선택해주세요</option>
        <option>남성</option>
        <option>여성</option>
      </select>

      <label for="birth_date">생년월일</label>
      <input type="date" id="birth_date" name="birth_date" required />

      <label for="occupation_type">개인특성 <small>(선택)</small></label>
      <select id="occupation_type" name="occupation_type">
        <option value="">해당 없음</option>
        <option>근로자</option>
        <option>구직자</option>
        <option>소상공인·자영업자</option>
        <option>대학생</option>
        <option>프리랜서·특수고용직</option>
      </select>

      <fieldset>
        <legend>관심분야 * <small>1개 이상 선택해주세요</small></legend>
        <div class="interest-grid">
          <label><input type="checkbox" name="interests" value="대출" /> 대출</label>
          <label><input type="checkbox" name="interests" value="주거·전세" /> 주거·전세</label>
          <label><input type="checkbox" name="interests" value="저축·자산형성" /> 저축·자산형성</label>
          <label><input type="checkbox" name="interests" value="투자·주식" /> 투자·주식</label>
          <label><input type="checkbox" name="interests" value="보험" /> 보험</label>
          <label><input type="checkbox" name="interests" value="창업·사업자금" /> 창업·사업자금</label>
          <label><input type="checkbox" name="interests" value="취업·채용" /> 취업·채용</label>
        </div>
      </fieldset>

      <button type="submit">제출</button>
      <p id="submit-message" role="status" hidden></p>
      <button type="button" id="reset-btn" class="secondary outline">프로필 초기화</button>
    </form>

    <!-- 제출 성공 시 위 <form>은 JS가 hidden 처리하고, 이 영역을 대신 보여준다. -->
    <div id="loading-state" hidden>
      <div class="spinner"></div>
      <p>회원님에게 맞는 정책을 찾고 있어요...</p>
    </div>
    </article>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "polistagram_profile";
    const form = document.getElementById("profile-form");
    const message = document.getElementById("submit-message");
    const startBtn = document.getElementById("start-btn");
    const profileSection = document.getElementById("profile-section");
    const resetBtn = document.getElementById("reset-btn");

    // "시작하기" 버튼을 누르면 접혀 있던 프로필 폼을 펼친다.
    startBtn.addEventListener("click", () => {
      profileSection.classList.add("open");
      // CSS transition이 끝나기까지 기다렸다가(약 500ms) 화면을 폼 쪽으로 스크롤해준다.
      // block: "start"는 폼의 윗부분이 화면 위쪽에 오도록 스크롤하라는 뜻이다.
      setTimeout(() => {
        profileSection.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 100);
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const checkedInterests = form.querySelectorAll('input[name="interests"]:checked');

      if (checkedInterests.length === 0) {
        message.hidden = false;
        message.style.color = "crimson";
        message.textContent = "관심분야를 1개 이상 선택해주세요.";
        return;
      }

      const profile = {
        region: form.region.value,
        gender: form.gender.value,
        birth_date: form.birth_date.value,
        occupation_type: form.occupation_type.value || null,
        interests: Array.from(checkedInterests).map((el) => el.value),
      };

      localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));

      // 폼을 숨기고 로딩 화면(스피너 + 문구)을 보여준 다음, 잠깐 뒤에 match.html로
      // 자동 이동한다. setTimeout의 두 번째 숫자(밀리초)만큼 기다린 뒤 콜백을 실행한다 —
      // 실제로는 오래 걸리는 작업이 없지만, 너무 빨리 넘어가면 "찾고 있다"는
      // 느낌이 안 들어서 일부러 짧게 대기시킨다.
      form.hidden = true;
      document.getElementById("loading-state").hidden = false;
      setTimeout(() => {
        location.href = "match.html";
      }, 1200);
    });

    // localStorage는 브라우저(기기)마다 따로 저장된다 — 다른 사람의 브라우저에는
    // 영향이 없다. 그래도 테스트하다 저장해둔 프로필을 지우고 싶을 때를 위한 버튼.
    resetBtn.addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      form.reset();
      message.hidden = false;
      message.style.color = "green";
      message.textContent = "✓ 저장된 프로필을 지웠어요.";
    });

    // 이전에 저장해둔 프로필이 있으면 폼에 다시 채워둔다. 단, 첫 화면은 항상
    // 히어로만 보여야 하므로 폼을 펼치지는 않는다 — "시작하기"를 눌러야 펼쳐진다.
    (function restoreProfile() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return;

      const profile = JSON.parse(saved);
      if (profile.region) form.region.value = profile.region;
      if (profile.gender) form.gender.value = profile.gender;
      if (profile.birth_date) form.birth_date.value = profile.birth_date;
      if (profile.occupation_type) form.occupation_type.value = profile.occupation_type;
      (profile.interests || []).forEach((value) => {
        const el = form.querySelector(`input[name="interests"][value="${value}"]`);
        if (el) el.checked = true;
      });
    })();
  </script>
</body>
</html>
