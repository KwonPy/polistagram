<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Polistagram</title>

  <!-- Pico.css: 클래스 없이도 기본 태그(form, input, button...)를 깔끔하게 스타일링해주는 CDN CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />

  <!-- Noto Sans KR: 한글을 포함한 폰트. Pico 기본 폰트는 한글이 없어 브라우저가 알아서 다른 폰트로 대체하는데,
       그러면 화면마다 한글 모양이 들쭉날쭉해질 수 있어 처음부터 한글 지원 폰트를 지정한다. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" />

  <style>
    /* Pico.css는 --pico-* 변수로 색을 관리한다. 값을 새로 정의하면 전체 버튼/링크/포커스 색이 한 번에 바뀐다. */
    :root {
      --pico-font-family: "Noto Sans KR", sans-serif;
      /* 후보 B 팔레트: 로즈(강조) + 블루(보조), 연한 핑크빛 배경.
         Pico v2는 버튼 배경(--pico-primary-background 등)이 --pico-primary와
         따로 노는 고정값이라, 관련 변수를 전부 같이 덮어써야 실제로 반영된다. */
      --pico-primary: #e11d48;
      --pico-primary-background: #e11d48;
      --pico-primary-border: #e11d48;
      --pico-primary-hover: #be123c;
      --pico-primary-hover-background: #be123c;
      --pico-primary-hover-border: #be123c;
      --pico-primary-focus: rgba(225, 29, 72, 0.25);
      --pico-primary-inverse: #ffffff;
      --pico-primary-underline: rgba(225, 29, 72, 0.5);
      --pico-primary-hover-underline: #be123c;
      --pico-background-color: #fff1f2;
      --pico-card-background-color: #ffffff;
    }
    /* 관심분야 체크박스에 체크할 때 등장하는 파랑 — 기존 블루 톤을 보조색으로 남겨둔다. */
    input[type="checkbox"]:checked {
      background-color: #2563eb;
      border-color: #2563eb;
    }

    /* 관심분야 체크박스를 2열 그리드로. 화면이 좁아지면(모바일) 1열로 바뀐다. */
    .interest-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.25rem 1rem;
    }
    @media (max-width: 480px) {
      .interest-grid {
        grid-template-columns: 1fr;
      }
    }
    /* 화면 폭이 넓어도 폼이 너무 옆으로 퍼지지 않도록 최대 폭을 제한한다 (가독성). */
    main.container {
      max-width: 560px;
    }
    header.app-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    header.app-header h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    header.app-header p {
      color: var(--pico-muted-color);
      font-size: 1rem;
    }
    /* 폼을 감싸는 카드. 배경/테두리는 Pico의 article 기본 스타일을 그대로 쓴다. */
    #profile-card {
      margin-bottom: 0;
    }
    /* 입력 항목 사이 간격을 넓혀서 각 질문이 하나씩 구분되어 보이게 한다. */
    #profile-form > label {
      display: block;
      font-weight: 500;
      margin-top: 1.5rem;
    }
    #profile-form > label:first-child {
      margin-top: 0;
    }
    fieldset {
      border: none;
      padding: 0;
      margin: 1.5rem 0 0 0;
    }
    fieldset legend {
      font-weight: 500;
      margin-bottom: 0.5rem;
    }
    button[type="submit"] {
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <!-- Pico.css는 <main class="container">로 감싼 내용을 화면 크기에 맞춰
       가운데 정렬 + 여백을 자동으로 잡아준다. 별도 반응형 CSS를 안 짜도 된다. -->
  <main class="container">
    <header class="app-header">
      <h1>Polistagram</h1>
      <p>쏟아지는 금융정책, 나에게 필요한 것만 쉽게.</p>
    </header>

    <!-- <article>은 Pico.css가 기본으로 카드 모양(테두리+배경+여백)을 입혀주는 태그다.
         새 CSS 없이도 폼 전체가 하나의 카드처럼 보인다. -->
    <article id="profile-card">
    <form id="profile-form">
      <label for="region">거주지역</label>
      <select id="region" name="region" required>
        <option value="" disabled selected>선택해주세요</option>
        <option>서울</option>
        <option>부산</option>
        <option>대구</option>
        <option>인천</option>
        <option>광주</option>
        <option>대전</option>
        <option>울산</option>
        <option>세종</option>
        <option>경기</option>
        <option>강원</option>
        <option>충북</option>
        <option>충남</option>
        <option>전북</option>
        <option>전남</option>
        <option>경북</option>
        <option>경남</option>
        <option>제주</option>
      </select>

      <label for="gender">성별</label>
      <select id="gender" name="gender" required>
        <option value="" disabled selected>선택해주세요</option>
        <option>남성</option>
        <option>여성</option>
      </select>

      <label for="birth_date">생년월일</label>
      <input type="date" id="birth_date" name="birth_date" required />

      <label for="occupation_type">개인특성 <small>(선택)</small></label>
      <select id="occupation_type" name="occupation_type">
        <option value="">해당 없음</option>
        <option>근로자</option>
        <option>구직자</option>
        <option>소상공인·자영업자</option>
        <option>대학생</option>
        <option>프리랜서·특수고용직</option>
      </select>

      <fieldset>
        <legend>관심분야 * <small>1개 이상 선택해주세요</small></legend>
        <div class="interest-grid">
          <label><input type="checkbox" name="interests" value="대출" /> 대출</label>
          <label><input type="checkbox" name="interests" value="주거·전세" /> 주거·전세</label>
          <label><input type="checkbox" name="interests" value="저축·자산형성" /> 저축·자산형성</label>
          <label><input type="checkbox" name="interests" value="투자·주식" /> 투자·주식</label>
          <label><input type="checkbox" name="interests" value="보험" /> 보험</label>
          <label><input type="checkbox" name="interests" value="창업·사업자금" /> 창업·사업자금</label>
          <label><input type="checkbox" name="interests" value="취업·채용" /> 취업·채용</label>
        </div>
      </fieldset>

      <button type="submit">제출</button>
      <p id="submit-message" role="status" hidden></p>
    </form>
    </article>
  </main>

  <script>
    const STORAGE_KEY = "polistagram_profile";
    const form = document.getElementById("profile-form");
    const message = document.getElementById("submit-message");

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const checkedInterests = form.querySelectorAll('input[name="interests"]:checked');

      if (checkedInterests.length === 0) {
        message.hidden = false;
        message.style.color = "crimson";
        message.textContent = "관심분야를 1개 이상 선택해주세요.";
        return;
      }

      const profile = {
        region: form.region.value,
        gender: form.gender.value,
        birth_date: form.birth_date.value,
        occupation_type: form.occupation_type.value || null,
        interests: Array.from(checkedInterests).map((el) => el.value),
      };

      localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));

      message.hidden = false;
      message.style.color = "green";
      message.innerHTML = '✓ 프로필이 저장됐어요. <a href="match.html">맞춤 정책 보러가기</a>';
    });

    // 이전에 저장해둔 프로필이 있으면 폼에 다시 채워준다.
    (function restoreProfile() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return;

      const profile = JSON.parse(saved);
      if (profile.region) form.region.value = profile.region;
      if (profile.gender) form.gender.value = profile.gender;
      if (profile.birth_date) form.birth_date.value = profile.birth_date;
      if (profile.occupation_type) form.occupation_type.value = profile.occupation_type;
      (profile.interests || []).forEach((value) => {
        const el = form.querySelector(`input[name="interests"][value="${value}"]`);
        if (el) el.checked = true;
      });
    })();
  </script>
</body>
</html>
