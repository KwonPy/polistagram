<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Polistagram - 맞춤 정책</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">Polistagram</span>
      </div>
      <p>내 프로필과 매칭된 금융정책</p>
    </header>

    <div id="tabs"></div>

    <p id="status" role="status">불러오는 중...</p>
    <div id="feed"></div>
  </main>

  <div id="cardsOverlay" role="dialog" aria-modal="true" aria-label="정책 카드뉴스">
    <!-- 실제 인스타그램 웹처럼, 화면 전체를 카드로 채우지 않고 가운데에 좁고 긴 세로
         카드(스테이지)만 두고 나머지는 어두운 배경으로 둔다. 모바일 폭에서는 스테이지가
         화면 전체를 자연스럽게 채운다. -->
    <div id="cardsStage">
      <div id="cardsTopBar">
        <div class="brand">
          <span class="brand-mark"></span>
          <span class="brand-name">Polistagram</span>
        </div>
        <div id="cardsTopRight">
          <span id="cardsCounter">1/1</span>
          <button id="cardsClose" type="button" aria-label="닫기">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="4" y1="4" x2="20" y2="20" />
              <line x1="20" y1="4" x2="4" y2="20" />
            </svg>
          </button>
        </div>
      </div>
      <div id="cardsTrack"></div>
      <div id="cardsDotsBottom"></div>
    </div>
  </div>

  <script src="match.js"></script>
</body>
</html>
